version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: api-gateway
    depends_on:
      - login
      - compounds
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  login:
    build:
      context: ./login
      dockerfile: Dockerfile
    container_name: login-service
    environment:
      JWT_SECRET: dev-secret
      DATABASE_PATH: /app/data/data.db
    expose:
      - "8000"
    volumes:
      - login_data:/app/data
    restart: unless-stopped

  compounds:
    build:
      context: .
      dockerfile: compounds/Dockerfile
    container_name: compounds-service
    environment:
      JWT_SECRET: dev-secret
      DATABASE_PATH: /app/data/data.db
      COMPOUND_SEED_PATH: /app/compoundGameList.ts
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK}
    expose:
      - "8000"
    volumes:
      - compounds_data:/app/data
    restart: unless-stopped

volumes:
  login_data:
  compounds_data:
